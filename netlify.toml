[build]
  publish = "."

[[redirects]]
  from = "/place/*"
  to = "/listing.html"
  status = 200

[[redirects]]
  from = "/recipe/*"
  to = "/recipe.html"
  status = 200

[[redirects]]
  from = "/join"
  to = "/interest.html"
  status = 200

[[redirects]]
  from = "/v"
  to = "/verify.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/staff.html"
  [headers.values]
    X-Robots-Tag = "noindex"
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/verify.html"
  [headers.values]
    X-Robots-Tag = "noindex"
    Cache-Control = "no-store"
